<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宿舍值日表 · 电工刷题</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Archivo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* ===================== 共享：调色板与模块框架 ===================== */
:root{
  --red:#d3202e; --blue:#1f4fa3; --yellow:#f2b90f;
  --green:#20a040; --orange:#e07820; --violet:#6040c0;
  --ink:#141414; --paper:#FFFFFF; --sub:#6b6b6b; --line:#EBEBEB;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Montserrat","Microsoft YaHei","PingFang SC",sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.6;-webkit-print-color-adjust:exact;print-color-adjust:exact}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.module{display:none}
.module.on{display:block}

/* ---------- 顶部模块切换栏 ---------- */
#topbar{position:fixed;top:0;left:0;right:0;z-index:100;background:transparent;padding:0 22px;height:52px;display:flex;align-items:center;justify-content:flex-end}
#topbar .tabs{display:flex;gap:16px;align-items:center}
#topbar .tabs button{width:38px;height:38px;padding:0;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer}
#topbar .tabs button .ic{transition:transform .22s}
#topbar .tabs button.on .ic{transform:scale(1.35)}
#topbar .ic-dot{width:14px;height:14px;border-radius:50%;background:var(--ink)}
#topbar .ic-sq{width:16px;height:16px;background:var(--red)}
#topbar .ic-tri{width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:19px solid var(--yellow)}
body{margin-top:52px}

/* ---------- 首页：几何构成（无文字） ---------- */
#moduleH{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;z-index:1}
#moduleH .sh-red{position:absolute;left:0;top:0;bottom:0;width:72px;background:var(--red);border:none;cursor:pointer;transition:width .55s cubic-bezier(.7,0,.3,1),box-shadow .55s cubic-bezier(.7,0,.3,1)}
#moduleH .sh-tri{position:absolute;right:0;bottom:0;width:40vw;height:36vh;background:var(--yellow);border:none;cursor:pointer;clip-path:polygon(100% 100%,100% 0,0 100%);transition:width .6s cubic-bezier(.7,0,.3,1),height .6s cubic-bezier(.7,0,.3,1)}
#moduleH .sh-dot{position:absolute;left:0;top:0;width:52px;height:52px;border-radius:50%;background:var(--blue);will-change:transform}
#moduleH.anim-red .sh-red{width:100vh}
#moduleH.anim-yellow .sh-tri{width:100vw;height:100vh}
#moduleH .sh-label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;pointer-events:none;font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:clamp(40px,7vw,88px);font-weight:900;letter-spacing:.2em;color:var(--ink);opacity:0}
#moduleH.anim-red .sh-label,#moduleH.anim-yellow .sh-label{animation:labelout .62s ease forwards}
@keyframes labelout{0%{opacity:0}22%{opacity:1}100%{opacity:0}}
@media (max-width:680px){
  #moduleH .sh-red{width:48px}
  #moduleH .sh-tri{width:60vw;height:32vh}
  #moduleH .sh-dot{width:34px;height:34px}
  #moduleH.anim-red .sh-red{width:100vw}
}

/* ---------- 首页：汉字碎片（偏旁部首）物理 ---------- */
#frag-layer{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}
#frag-layer .frag{position:absolute;left:0;top:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-weight:700;line-height:1;white-space:nowrap;will-change:transform,opacity;transition:opacity .25s ease}
#frag-layer .char{position:absolute;left:0;top:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-weight:900;line-height:1;color:var(--ink);opacity:0;will-change:transform,opacity;transition:opacity .3s ease}
#moduleH.assemble .sh-red{width:26vw;box-shadow:inset -14px 0 0 rgba(0,0,0,.16)}
@media (max-width:680px){#moduleH.assemble .sh-red{width:44vw}}

/* ---------- 转场色幕 ---------- */
.veil{position:fixed;left:0;top:0;right:0;bottom:0;z-index:90;opacity:0;pointer-events:none;transition:opacity .34s ease}
.veil.show{opacity:1}
.veil-red{background:var(--red)}
.veil-yellow{background:var(--yellow)}

/* ===================== 模块一：宿舍值日表（原样式，作用域 #moduleR） ===================== */
#moduleR .sheet{width:210mm;max-width:100%;margin:24px auto;background:none}
#moduleR .page{background:#fff;padding:44px 48px 48px;position:relative;overflow:hidden;min-height:297mm}
#moduleR .layout{display:flex;gap:44px;align-items:flex-start;margin-top:30px}
#moduleR .title-block{display:flex;align-items:flex-start;gap:24px;flex-shrink:0}
#moduleR .content{flex:1;min-width:0}
#moduleR h1{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:clamp(56px,9vw,96px);font-weight:900;writing-mode:vertical-rl;letter-spacing:0;line-height:1;text-align:left;color:var(--ink);flex-shrink:0}
#moduleR .title-side{display:flex;flex-direction:column;gap:22px;padding-top:4px}
#moduleR .kicker{font-size:12px;font-weight:700;letter-spacing:.35em;text-transform:uppercase;color:var(--red);line-height:1.9;writing-mode:vertical-rl}
#moduleR .title-geo{display:flex;flex-direction:column;gap:14px;align-items:center}
#moduleR .geo-circle{width:30px;height:30px;border-radius:50%;background:var(--blue);flex-shrink:0}
#moduleR .geo-tri{width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:21px solid var(--yellow)}
#moduleR .geo-bar{height:100px;width:10px;background:var(--red)}
#moduleR section + section{margin-top:34px}
#moduleR .sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:12px}
#moduleR .sec-num{font-family:"Montserrat","Microsoft YaHei",sans-serif;font-size:26px;font-weight:900;color:var(--ink)}
#moduleR .sec-title{font-size:22px;font-weight:800;letter-spacing:.2em}
#moduleR .sec-shape{align-self:center}
#moduleR .shape-circle{width:24px;height:24px;border-radius:50%;background:var(--blue)}
#moduleR .shape-square{width:20px;height:20px;background:var(--red)}
#moduleR .shape-tri{width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-bottom:22px solid var(--yellow)}
#moduleR table{width:90%;border-collapse:collapse;font-size:20px}
#moduleR th{font-family:"Montserrat","Microsoft YaHei",sans-serif;background:var(--ink);color:#fff;font-size:16px;font-weight:700;letter-spacing:.2em;text-align:left;padding:7px 14px}
#moduleR td{border:none;padding:12px 14px;text-align:left;font-weight:500}
#moduleR tbody tr{background:#fff;transition:background .15s}
#moduleR tbody tr:hover{background:#f3f0e6}
#moduleR td.week{font-family:"Montserrat","Microsoft YaHei",sans-serif;font-weight:800;letter-spacing:.06em}
#moduleR .toolbar{position:absolute;top:16px;right:16px;display:flex;gap:8px;z-index:9}
#moduleR .toolbar button{font-family:"Montserrat","Microsoft YaHei",sans-serif;font-size:12px;font-weight:700;letter-spacing:.15em;padding:10px 18px;background:var(--ink);color:#fff;cursor:pointer}
#moduleR.editing .edit-toggle{background:var(--red)}
#moduleR.editing td{cursor:text}
#moduleR.editing td:focus{outline:1.5px dashed var(--blue);outline-offset:-1px;background:#eef2f8}
#moduleR.editing td[contenteditable="true"]{background:#f9fafc}
#moduleR footer{margin-top:34px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:12px;font-weight:500;color:#555}
#moduleR .strip{display:flex;height:10px}
#moduleR .strip span{width:22px;height:10px}
#moduleR .strip .r{background:var(--red)}
#moduleR .strip .b{background:var(--blue)}
#moduleR .strip .y{background:var(--yellow)}
#moduleR .footer-note{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600}

@media (max-width:720px){
  #moduleR .page{padding:28px 20px;min-height:auto}
  #moduleR .layout{flex-direction:column;gap:20px;margin-top:8px}
  #moduleR .title-block{flex-direction:row;align-items:flex-start;gap:14px}
  #moduleR h1{font-size:clamp(40px,11vw,64px)}
  #moduleR .title-side{padding-top:0;gap:14px}
  #moduleR .kicker{letter-spacing:.3em;font-size:11px}
  #moduleR .title-geo{gap:12px}
  #moduleR .content table{font-size:16px}
  #moduleR .content th,#moduleR .content td{padding:8px 10px}
  #moduleR section + section{margin-top:22px}
  #moduleR .sec-num{font-size:22px}
  #moduleR .sec-title{font-size:16px}
  #moduleR .footer-note{display:none}
  #moduleR .geo-bar{width:22px;height:22px;background:var(--red)}
  #moduleR .geo-circle{width:22px;height:22px}
  #moduleR .geo-tri{border-left-width:11px;border-right-width:11px;border-bottom-width:19px}
}

/* ===================== 模块二：电工刷题 ===================== */
#moduleB .wrap{max-width:1180px;margin:0 auto;padding:26px 24px 80px;display:grid;grid-template-columns:236px 1fr;gap:26px;align-items:start}
#moduleB .leftcol{position:sticky;top:78px;display:flex;flex-direction:column;gap:14px}
#moduleB .ctrl{background:transparent;border:none;padding:2px 0 8px}
#moduleB .search{position:relative;margin-bottom:10px}
#moduleB .search input{width:100%;padding:8px 12px 8px 32px;border:none;background:#F5F5F5;font-size:15px;color:var(--ink);outline:none;font-family:inherit}
#moduleB .search input:focus{background:#ECECEC}
#moduleB .search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--sub);fill:none;stroke-width:2}
#moduleB .tpills{display:flex;gap:5px}
#moduleB .tpill{flex:1;padding:6px 4px;font-size:13.5px;font-weight:700;color:var(--sub);border:none;background:#F5F5F5}
#moduleB .tpill.on{background:var(--ink);color:#fff}
#moduleB .wrongbtn{margin-top:10px;width:100%;padding:8px 4px;font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--sub);background:#fff;border:1.5px solid var(--line);cursor:pointer;transition:all .15s}
#moduleB .wrongbtn:hover{color:var(--ink);border-color:var(--ink)}
#moduleB .wrongbtn.on{background:var(--red);border-color:var(--red);color:#fff}
#moduleB .side{display:flex;flex-direction:column;gap:2px}
#moduleB .cat{display:flex;align-items:center;gap:10px;padding:8px 4px;text-align:left;border:none;background:none;cursor:pointer}
#moduleB .cat .nm{font-size:15px;font-weight:600;color:#4a4a4a;transition:color .15s}
#moduleB .cat:hover .nm{color:var(--ink)}
#moduleB .cat.on .nm{font-weight:800;color:var(--ink)}
#moduleB .cat .ct{margin-left:auto;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
#moduleB .cat.all{padding:6px 4px 10px}
#moduleB .cat.all .nm{font-size:19px;font-weight:800;color:var(--ink)}
#moduleB .ic{width:15px;height:15px;flex:none;transition:transform .2s}
#moduleB .ic.tri{clip-path:polygon(50% 0%,0% 100%,100% 100%)}
#moduleB .ic.sq{border-radius:0}
#moduleB .ic.circle{border-radius:50%}
#moduleB .ic.reuleaux{width:17px;height:14px;clip-path:url(#reuleaux)}
#moduleB .ic.trap{width:18px;height:13px;clip-path:polygon(18% 0%,82% 0%,100% 100%,0% 100%)}
#moduleB .ic.ellipse{width:18px;height:12px;border-radius:50%}
#moduleB .cat.on .ic{transform:scale(1.25)}
#moduleB .side .note{font-size:12px;color:var(--sub);padding:10px 4px 0;line-height:1.6}
#moduleB .chead{background:#fff;border:none;border-bottom:1px solid var(--line);padding:18px 20px 14px;margin-bottom:16px;position:relative}
#moduleB .chead::before{content:"";position:absolute;top:0;left:0;width:56px;height:6px;background:var(--catbar,var(--ink))}
#moduleB .chead::after{content:"";position:absolute;top:0;right:0;width:132px;height:6px;background:linear-gradient(to right,var(--yellow) 0 16.666%,var(--red) 16.666% 33.332%,var(--blue) 33.332% 50%,var(--green) 50% 66.666%,var(--orange) 66.666% 83.332%,var(--violet) 83.332% 100%)}
#moduleB .chead h2{font-family:"Microsoft YaHei",sans-serif;font-size:21px;display:flex;align-items:baseline;gap:12px;font-weight:800}
#moduleB .chead h2 .st{font-size:13.5px;color:var(--sub);font-weight:400}
#moduleB .kwline{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#moduleB .kw{padding:3px 10px;font-size:13.5px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-weight:600}
#moduleB .kw .n{opacity:.6;font-size:12px;margin-left:2px}
#moduleB .count{font-size:13.5px;color:var(--sub);margin:0 2px 12px}
#moduleB #list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-items:stretch}
#moduleB .q{background:#fff;border:none;padding:16px 16px 14px;display:flex;flex-direction:column;position:relative}
#moduleB .q::before{content:"";position:absolute;top:0;left:0;width:40px;height:5px;background:var(--catbar,var(--ink))}
#moduleB .q .tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--sub);margin-right:9px;vertical-align:middle;letter-spacing:.03em}
#moduleB .q .kind-ic{width:10px;height:10px;background:var(--ink);flex:none}
#moduleB .q .kind-ic.circle{border-radius:50%}
#moduleB .q .kind-ic.tri{clip-path:polygon(50% 0%,0% 100%,100% 100%)}
#moduleB .q .t{font-weight:700;font-size:16px;line-height:1.55}
#moduleB .q mark{display:inline-block;padding:2px 4px;margin:0 3px;line-height:1.25;font-weight:800;font-size:0.8em;background:none}
#moduleB .q .opts{margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:15px}
#moduleB .q .opt{padding:2px 8px;color:var(--ink)}
#moduleB .q .opt.hit{color:var(--ink);font-weight:800;background:#EFEFEF}
#moduleB .q .opt.hit::before{content:"√ ";font-weight:800}
#moduleB .q .foot{margin-top:auto;padding-top:8px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:2px}
#moduleB .q .ans{font-size:14px;color:var(--ink);font-weight:800}
#moduleB .q .sum{font-size:13.5px;color:var(--sub);line-height:1.55}
#moduleB .q .sum::before{content:"考点速记｜";color:#9a9a9a}
#moduleB .q .cats{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#moduleB .q .cmini{display:inline-block;width:12px;height:12px;flex:none}
#moduleB .q .cmini.tri{clip-path:polygon(50% 0%,0% 100%,100% 100%)}
#moduleB .q .cmini.sq{border-radius:0}
#moduleB .q .cmini.circle{border-radius:50%}
#moduleB .q .cmini.reuleaux{width:13px;height:11px;clip-path:url(#reuleaux)}
#moduleB .q .cmini.trap{width:14px;height:10px;clip-path:polygon(18% 0%,82% 0%,100% 100%,0% 100%)}
#moduleB .q .cmini.ellipse{width:14px;height:9px;border-radius:50%}
#moduleB .empty{text-align:center;color:var(--sub);padding:70px 0;font-size:15px;grid-column:1/-1}
#moduleB footer{text-align:center;color:var(--sub);font-size:13px;padding:26px 0 34px;border-top:1px solid var(--line);max-width:1180px;margin:0 auto}

@media (max-width:960px){
  #moduleB #list{grid-template-columns:1fr}
}
@media (max-width:860px){
  #moduleB .wrap{grid-template-columns:1fr;gap:14px;padding:16px 12px 64px}
  #moduleB .leftcol{position:static;gap:10px}
  #moduleB .ctrl{padding:2px 0 6px}
  #moduleB .side{flex-direction:row;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  #moduleB .side::-webkit-scrollbar{display:none}
  #moduleB .side .note{display:none}
  #moduleB .cat{flex:none;padding:8px 12px}
  #moduleB .chead{padding:16px 14px 12px;margin-bottom:12px}
  #moduleB .chead h2{flex-wrap:wrap;gap:8px}
  #moduleB .chead::before{width:40px;height:5px}
  #moduleB .chead::after{width:96px;height:5px}
  #moduleB .q{padding:14px 14px 12px}
}

/* ===================== 打印 ===================== */
@page{size:A4;margin:0}
@media print{
  body{margin-top:0}
  #topbar{display:none}
  #moduleR tbody tr:hover{background:#fff}
  #moduleR .toolbar{display:none}
  #moduleR.editing td{background:#fff}
}
</style>
</head>
<body>

<!-- ========== 模块切换栏 ========== -->
<nav id="topbar">
  <div class="tabs">
    <button data-mod="home" class="on" title="首页"><span class="ic ic-dot"></span></button>
    <button data-mod="roster" title="宿舍值日表"><span class="ic ic-sq"></span></button>
    <button data-mod="bank" title="电工刷题"><span class="ic ic-tri"></span></button>
  </div>
</nav>

<!-- ========== 首页：几何构成（无文字） ========== -->
<div id="moduleH" class="module on">
  <button class="sh-red" onclick="navTo('roster')" aria-label="宿舍值日表"></button>
  <button class="sh-tri" onclick="navTo('bank')" aria-label="电工刷题"></button>
  <span class="sh-dot"></span>
  <span class="sh-label" id="sh-label"></span>
  <div id="frag-layer"></div>
</div>

<!-- 转场色幕（跳转时覆盖画面再淡出） -->
<div class="veil" id="sh-veil"></div>

<!-- ========== 模块一：宿舍值日表 ========== -->
<div id="moduleR" class="module">
  <div class="sheet">
    <div class="page">
      <div class="toolbar">
        <button class="export-toggle" id="exportBtn">导 出 图 片</button>
        <button class="edit-toggle" id="editBtn">编 辑 模 式</button>
      </div>

      <div class="layout">
        <div class="title-block">
          <h1>宿舍值日表</h1>
          <div class="title-side">
            <div class="kicker">Dorm<br>Duty<br>Roster</div>
            <div class="title-geo">
              <span class="geo-circle"></span>
              <span class="geo-tri"></span>
              <span class="geo-bar"></span>
            </div>
          </div>
        </div>

        <div class="content">
          <section>
            <div class="sec-head">
              <span class="sec-num">一</span>
              <span class="sec-title">值日安排</span>
              <span class="sec-shape shape-square"></span>
            </div>
            <table>
              <thead>
                <tr><th>值日星期</th><th>值日人员</th><th>负责区域</th></tr>
              </thead>
              <tbody>
                <tr><td class="week">星期一</td><td>王浩然</td><td rowspan="7">全部区域</td></tr>
                <tr><td class="week">星期二</td><td>吴敏辉</td></tr>
                <tr><td class="week">星期三</td><td>吴晋成</td></tr>
                <tr><td class="week">星期四</td><td></td></tr>
                <tr><td class="week">星期五</td><td>方懿拓</td></tr>
                <tr><td class="week">星期六</td><td>武文杰</td></tr>
                <tr><td class="week">星期日</td><td>全部</td></tr>
              </tbody>
            </table>
          </section>

          <section>
            <div class="sec-head">
              <span class="sec-num">二</span>
              <span class="sec-title">值日标准</span>
              <span class="sec-shape shape-circle"></span>
            </div>
            <table>
              <thead>
                <tr><th>项目</th><th>达标要求</th><th>备注</th></tr>
              </thead>
              <tbody>
                <tr><td class="week">地面</td><td>无垃圾、无明显灰尘</td><td></td></tr>
                <tr><td class="week">垃圾</td><td>当日清空并投放</td><td></td></tr>
                <tr><td class="week">桌面</td><td>物品摆放整齐</td><td></td></tr>
                <tr><td class="week">卫生间</td><td>洗漱池、地面清洁无异味</td><td></td></tr>
                <tr><td class="week">阳台 / 公共区</td><td>衣物收纳整齐、无杂物</td><td></td></tr>
                <tr><td class="week">门窗 / 窗台</td><td>无灰尘、开关正常</td><td></td></tr>
              </tbody>
            </table>
          </section>
        </div>
      </div>

      <footer>
        <div class="strip">
          <span class="r"></span><span class="b"></span><span class="y"></span>
          <span class="r"></span><span class="b"></span><span class="y"></span>
          <span class="r"></span><span class="b"></span><span class="y"></span>
        </div>
        <span class="footer-note">Form follows function.</span>
      </footer>
    </div>
  </div>
</div>

<!-- ========== 模块二：电工刷题 ========== -->
<div id="moduleB" class="module">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><clipPath id="reuleaux" clipPathUnits="objectBoundingBox"><path d="M0.5,0.03 A0.82,0.82 0 0,1 0.95,0.74 A0.82,0.82 0 0,1 0.05,0.74 A0.82,0.82 0 0,1 0.5,0.03 Z"/></clipPath></defs></svg>
  <div class="wrap">
    <div class="leftcol">
      <div class="ctrl">
        <div class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>

<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script>
/* ===================== 模块切换 ===================== */
const MOD_IDS = { home:'moduleH', roster:'moduleR', bank:'moduleB' };
function switchMod(name){
  if(!MOD_IDS[name]) name = 'home';
  document.querySelectorAll('.module').forEach(m=>m.classList.remove('on'));
  document.getElementById(MOD_IDS[name]).classList.add('on');
  document.querySelectorAll('#topbar .tabs button').forEach(b=>b.classList.toggle('on', b.dataset.mod===name));
  location.hash = name;
  window.scrollTo(0, 0);
  if(name === 'home' && window.fragReset) window.fragReset();
}
function navTo(name){
  const H = document.getElementById('moduleH');
  if(name === 'home' || !H.classList.contains('on')){
    switchMod(name);
    return;
  }
  if(H.dataset.animing === '1') return;   // 动画进行中，忽略重复点击
  H.dataset.animing = '1';
  window.fragAssemble(name);              // roster → 红条碎片组装；bank → 黄三角碎片组装
}
document.querySelectorAll('#topbar .tabs button').forEach(b=>b.onclick=()=>navTo(b.dataset.mod));

/* ===================== 首页：汉字碎片（偏旁部首）物理引擎 ===================== */
(function(){
  const layer = document.getElementById('frag-layer');
  if(!layer) return;
  const H = document.getElementById('moduleH');
  const SETS = [
    { key:'roster', title:['宿','舍','值','日','表'],
      parts:[['宀','亻','百'],['人','干','口'],['亻','直'],['日'],['主','衣']],
      palette:['var(--red)','var(--blue)','var(--ink)','var(--orange)','var(--green)','var(--violet)'] },
    { key:'bank', title:['电','工','刷','题'],
      parts:[['田','乚'],['一','丨','一'],['尸','巾','刂'],['日','疋','丆','贝']],
      palette:['var(--orange)','var(--blue)','var(--ink)','var(--red)','var(--green)','var(--violet)'] },
  ];
  const GRAV = 920, REST = 0.3, SLEEP_SPEED = 16, SLEEP_FRAMES = 20;

  const frags = [], chars = [];
  let mode = 'scatter', assembleStart = 0, activeSet = null, activeFrags = [], assembling = false;
  let last = performance.now();

  SETS.forEach(set=>{
    set.title.forEach((ch, i)=>{
      const el = document.createElement('span');
      el.className = 'char'; el.textContent = ch; el.style.zIndex = '6';
      layer.appendChild(el);
      chars.push({ el, i, set });
    });
    set.parts.forEach((parts, ci)=>{
      parts.forEach((p, pi)=>{
        const el = document.createElement('span');
        el.className = 'frag'; el.textContent = p;
        const fs = 52 + Math.random()*14;
        el.style.fontSize = fs + 'px';
        el.style.color = set.palette[(ci + pi) % set.palette.length];
        layer.appendChild(el);
        frags.push({ el, ci, pi, set, x:0, y:0, vx:0, vy:0, r: fs*0.55, rot:0 });
      });
    });
  });

  const barW  = () => innerWidth < 680 ? 48 : 72;
  const currentBarW = () => assembling
    ? (innerWidth < 680 ? Math.round(innerWidth*0.44) : Math.round(innerWidth*0.26))
    : barW();
  let dot = null;
  (function(){
    const el = H.querySelector('.sh-dot');
    if(!el) return;
    el.style.left = '0'; el.style.top = '0';
    dot = { el, x:0, y:0, vx:0, vy:0, r: innerWidth<680?17:26, m:3 };
  })();
  const shTri = H.querySelector('.sh-tri');
  let triStart = null, triEnd = null, triT0 = 0;

  function collideTri(f){
    const W = innerWidth, Hh = innerHeight;
    const Tx = W, Ty = 0.64*Hh, Bx = 0.60*W, By = Hh;
    const ex = Bx - Tx, ey = By - Ty;
    const denom = ex*ex + ey*ey || 1;
    const t = Math.max(0, Math.min(1, ((f.x - Tx)*ex + (f.y - Ty)*ey)/denom));
    const cx = Tx + t*ex, cy = Ty + t*ey;
    let dx = f.x - cx, dy = f.y - cy;
    let d = Math.hypot(dx, dy);
    if(d < f.r){
      if(d === 0){ dx = -ey; dy = ex; d = Math.hypot(dx, dy); }
      const nx = dx/d, ny = dy/d;
      f.x = cx + nx*f.r; f.y = cy + ny*f.r;
      const vn = f.vx*nx + f.vy*ny;
      if(vn < 0){
        if(-vn > 80){ f.vx -= (1+REST)*vn*nx; f.vy -= (1+REST)*vn*ny; }  // 快速冲击才反弹
        else { f.vx -= vn*nx; f.vy -= vn*ny; }                              // 慢速贴住不弹
      }
      f.vx *= 0.85; f.vy *= 0.85;                                            // 斜面摩擦，停止滑动
    }
  }
  function pair(a, b){
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy), rr = a.r + b.r;
    if(d > 0 && d < rr){
      const nx = dx/d, ny = dy/d, ov = rr - d;
      const ma = a.sleeping ? 1e9 : (a.m || 1), mb = b.sleeping ? 1e9 : (b.m || 1), mt = ma + mb;
      a.x -= nx*ov*(mb/mt); a.y -= ny*ov*(mb/mt);
      b.x += nx*ov*(ma/mt); b.y += ny*ov*(ma/mt);
      const vn = (b.vx - a.vx)*nx + (b.vy - a.vy)*ny;
      if(vn < 0){
        const approach = -vn;
        const e = approach < 60 ? 0 : REST;      // 慢速接触不反弹，快速冲击才反弹
        const imp = -(1+e)*vn;
        a.vx -= (imp*mb/mt)*nx; a.vy -= (imp*mb/mt)*ny;
        b.vx += (imp*ma/mt)*nx; b.vy += (imp*ma/mt)*ny;
      }
    }
  }
  function scatter(){
    const W = innerWidth, Hh = innerHeight, bw = barW();
    frags.forEach(f=>{
      f.x = bw + 40 + Math.random()*(W - bw - 120);
      f.y = 60 + Math.random()*(Hh - 120);
      if(f.x > W*0.6 && f.y > Hh*0.72){ f.x = bw + 40 + Math.random()*(W*0.5 - bw); }
      f.vx = (Math.random() - 0.5)*280;
      f.vy = (Math.random() - 0.5)*160;
      f.rot = (Math.random() - 0.5)*36;
      f.sleeping = false; f.still = 0;
    });
    if(dot){
      dot.r = innerWidth < 680 ? 17 : 26;
      dot.x = bw + 40 + Math.random()*(W - bw - 120);
      dot.y = 70 + Math.random()*60;
      dot.vx = (Math.random() - 0.5)*120;
      dot.vy = 0;
      dot.sleeping = false; dot.still = 0;
      dot.el.style.transform = `translate(${dot.x}px,${dot.y}px) translate(-50%,-50%)`;
    }
  }
  function layout(set, ci){
    const W = innerWidth;
    const cs = Math.min(84, Math.max(56, Math.round(W*0.09)));
    const gap = cs*0.22;
    if(set.key === 'roster'){
      const cy = 64 + ci*(cs + gap) + cs*0.5;   // 顶部锚定，靠近网页顶端，避免遮住下方偏旁
      const bw = innerWidth<680 ? Math.round(W*0.44) : Math.round(W*0.26);
      return { cx: bw + cs*0.5 + 14, cy, cs };
    }
    // bank：2×2 矩形，右上角
    const m = innerWidth < 680 ? 16 : 28;
    const top = 64;
    const row = Math.floor(ci / 2), col = ci % 2;
    const cx = (W - m - cs*0.5) - (1 - col)*(cs + gap);
    const cy = top + cs*0.5 + row*(cs + gap);
    return { cx, cy, cs };
  }
  function easeOutBack(t){
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3*Math.pow(t-1, 3) + c1*Math.pow(t-1, 2);
  }
  function assemble(setKey){
    if(assembling) return;
    const set = SETS.find(s=>s.key === setKey);
    if(!set) return;
    assembling = true;
    activeSet = setKey;
    if(setKey === 'roster'){
      H.classList.add('assemble');
    } else {
      shTri.style.transition = 'none';
      const r = shTri.getBoundingClientRect();
      triStart = { w: r.width, h: r.height };
      triEnd = { w: innerWidth, h: innerHeight };
      triT0 = performance.now();
    }
    assembleStart = performance.now();
    activeFrags = frags.filter(f=>f.set.key === setKey).map(f=>{ const p = layout(f.set, f.ci); return { f, tx:p.cx, ty:p.cy }; });
    mode = 'assemble';
    setTimeout(()=>{                                   // 碎片到位 → 显形完整字
      chars.filter(c=>c.set.key === setKey).forEach(c=>{ const p = layout(c.set, c.i);
        c.el.style.fontSize = p.cs + 'px';
        c.el.style.transform = `translate(${p.cx}px,${p.cy}px) translate(-50%,-50%)`;
        c.el.style.opacity = '1'; });
      activeFrags.forEach(a=>{ a.f.el.style.opacity = '0'; });
      mode = 'assembled';
    }, 900);
    const veil = document.getElementById('sh-veil');
    veil.className = 'veil ' + (setKey === 'roster' ? 'veil-red' : 'veil-yellow');
    setTimeout(()=>{ veil.classList.add('show'); }, 1500);
    setTimeout(()=>{ switchMod(setKey === 'roster' ? 'roster' : 'bank'); reset(); }, 1850);
    setTimeout(()=>{ veil.classList.remove('show'); H.dataset.animing = '0'; }, 1950);
  }
  function reset(){
    H.classList.remove('assemble', 'assemble-bank');
    if(shTri){ shTri.style.transition = ''; shTri.style.width = ''; shTri.style.height = ''; }
    chars.forEach(c=>{ c.el.style.opacity = '0'; });
    frags.forEach(f=>{ f.el.style.opacity = '1'; });
    scatter(); mode = 'scatter'; assembling = false; activeSet = null; activeFrags = []; triStart = null; triEnd = null;
  }
  function applyStatic(f, W, Hh){
    const bw = currentBarW();
    if(f.x < f.r){ f.x = f.r; f.vx = Math.abs(f.vx)*REST; }
    if(f.x > W - f.r){ f.x = W - f.r; f.vx = -Math.abs(f.vx)*REST; }
    if(f.y < f.r){ f.y = f.r; f.vy = Math.abs(f.vy)*REST; }
    if(f.y > Hh - f.r){ f.y = Hh - f.r; f.vy = f.vy > 80 ? -f.vy*REST : 0; f.vx *= 0.85; }
    if(f.x < bw + f.r){ f.x = bw + f.r; if(f.vx < 0) f.vx = Math.abs(f.vx)*REST; }
    collideTri(f);
  }
  function settle(b){
    const sp = Math.hypot(b.vx, b.vy);
    if(sp < SLEEP_SPEED){
      b.still = (b.still || 0) + 1;
      if(b.still >= SLEEP_FRAMES){ b.vx = 0; b.vy = 0; b.sleeping = true; }
    } else {
      b.still = 0;
    }
  }
  function step(now){
    const dt = Math.min(0.033, (now - last)/1000); last = now;
    const W = innerWidth, Hh = innerHeight;
    if(dot && !dot.sleeping){
      dot.vy += GRAV*dt; dot.x += dot.vx*dt; dot.y += dot.vy*dt;
      dot.vx *= 0.985; dot.vy *= 0.985;
      applyStatic(dot, W, Hh);
    }
    if(mode === 'scatter'){
      for(const f of frags){
        if(f.sleeping) continue;
        f.vy += GRAV*dt; f.x += f.vx*dt; f.y += f.vy*dt;
        f.vx *= 0.985; f.vy *= 0.985;
        applyStatic(f, W, Hh);
      }
      const bodies = dot ? [dot, ...frags] : frags;
      for(let i=0;i<bodies.length;i++) for(let j=i+1;j<bodies.length;j++) pair(bodies[i], bodies[j]);
      for(const f of frags) settle(f);
      if(dot) settle(dot);
      for(const f of frags)
        f.el.style.transform = `translate(${f.x}px,${f.y}px) translate(-50%,-50%) rotate(${f.rot}deg)`;
    } else if(mode === 'assemble'){
      const idle = frags.filter(f=>f.set.key !== activeSet);
      for(const f of idle){
        if(f.sleeping) continue;
        f.vy += GRAV*dt; f.x += f.vx*dt; f.y += f.vy*dt;
        f.vx *= 0.985; f.vy *= 0.985;
        applyStatic(f, W, Hh);
      }
      const bodies = dot ? [dot, ...idle] : idle;
      for(let i=0;i<bodies.length;i++) for(let j=i+1;j<bodies.length;j++) pair(bodies[i], bodies[j]);
      for(const f of idle) settle(f);
      for(const f of idle)
        f.el.style.transform = `translate(${f.x}px,${f.y}px) translate(-50%,-50%) rotate(${f.rot}deg)`;
      const nowMs = performance.now();
      if(activeSet === 'bank'){
        const tt = Math.min(1, (nowMs - triT0)/800);
        const te = 1 - Math.pow(1 - tt, 3);
        const tw = triStart.w + (triEnd.w - triStart.w)*te;
        const th = triStart.h + (triEnd.h - triStart.h)*te;
        shTri.style.width = tw + 'px';
        shTri.style.height = th + 'px';
      }
      for(const a of activeFrags){
        const f = a.f;
        const t = Math.max(0, Math.min(1, (nowMs - assembleStart - ((f.ci*40 + f.pi*30) % 180))/620));
        const e = easeOutBack(t);
        let x = f.x + (a.tx - f.x)*e;
        let y = f.y + (a.ty - f.y)*e;
        if(activeSet === 'bank'){
          const tt = Math.min(1, (nowMs - triT0)/800);
          const lift = (1 - tt) * 150;   // 黄三角上升时把碎片「拖上去」
          y -= lift; x -= lift * 0.35;
        }
        f.el.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%) rotate(${f.rot*(1-t)}deg)`;
        if(t >= 1){ f.x = a.tx; f.y = a.ty; }
      }
    }
    if(dot) dot.el.style.transform = `translate(${dot.x}px,${dot.y}px) translate(-50%,-50%)`;
    requestAnimationFrame(step);
  }

  window.fragAssemble = assemble;
  window.fragReset = reset;
  scatter();
  requestAnimationFrame(step);
})();

/* ===================== 模块一：宿舍值日表（原功能：编辑/导出/云端同步） ===================== */
(function(){
  const R = document.getElementById('moduleR');
  const KEY = 'dorm-roster-data';
  const SUPABASE_URL = 'https://uyuhbfwqnxwzvwdvjwdl.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_BzzjxNEacZ81oJPfOHA0VA_OSzSlmhs';
  const btn = R.querySelector('#editBtn');
  const cells = Array.from(R.querySelectorAll('td'));
  let editing = false;

  function collect(){
    return Array.from(R.querySelectorAll('table')).map(t=>{
      const rows = Array.from(t.querySelectorAll('tbody tr'));
      return rows.map(r=>Array.from(r.querySelectorAll('td')).map(td=>td.innerHTML));
    });
  }
  function apply(data){
    if(!Array.isArray(data)) return;
    const tables = R.querySelectorAll('table');
    data.forEach((tableData, ti)=>{
      const tbody = tables[ti] && tables[ti].querySelector('tbody');
      if(!tbody) return;
      Array.from(tbody.querySelectorAll('tr')).forEach((tr, ri)=>{
        const rowData = tableData[ri];
        if(!rowData) return;
        Array.from(tr.querySelectorAll('td')).forEach((td, di)=>{
          if(rowData[di] !== undefined) td.innerHTML = rowData[di];
        });
      });
    });
  }
  function save(){
    const data = collect();
    localStorage.setItem(KEY, JSON.stringify(data));
    upload(data);
  }
  async function upload(data){
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/roster?id=eq.1`, {
        method:'PATCH',
        headers:{ 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${SUPABASE_KEY}`, 'Content-Type':'application/json', 'Prefer':'return=minimal' },
        body: JSON.stringify({ data })
      });
      if(!res.ok) throw new Error('HTTP '+res.status);
    }catch(e){ console.warn('云端保存失败（roster 表可能未创建），已保存到本地缓存。', e); }
  }
  async function load(){
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/roster?id=eq.1&select=data`, {
        headers:{ 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${SUPABASE_KEY}` }
      });
      if(!res.ok) throw new Error('HTTP '+res.status);
      const rows = await res.json();
      const data = Array.isArray(rows) && rows[0] ? rows[0].data : null;
      if(data != null){
        apply(data);
        localStorage.setItem(KEY, JSON.stringify(data));
        return;
      }
      throw new Error('empty');
    }catch(e){
      console.warn('云端加载失败，回退本地缓存。', e);
      const raw = localStorage.getItem(KEY);
      if(!raw) return;
      try{ apply(JSON.parse(raw)); }catch(e2){}
    }
  }
  btn.addEventListener('click', ()=>{
    editing = !editing;
    R.classList.toggle('editing', editing);
    btn.textContent = editing ? '退 出 编 辑' : '编 辑 模 式';
    cells.forEach(c=>c.contentEditable = editing ? 'true' : 'false');
    if(!editing) save();
  });
  R.querySelector('#exportBtn').addEventListener('click', async ()=>{
    const page = R.querySelector('.page');
    const wasEditing = editing;
    if(wasEditing){
      R.classList.remove('editing');
      cells.forEach(c=>c.contentEditable='false');
    }
    try{
      const w = page.offsetWidth, h = page.offsetHeight;
      const scale = Math.min(6, 3307/w);
      const dataUrl = await htmlToImage.toPng(page, {
        width: Math.round(w*scale), height: Math.round(h*scale),
        style:{ transform:`scale(${scale})`, transformOrigin:'top left' },
        backgroundColor:'#ffffff'
      });
      const link = document.createElement('a');
      link.download = '宿舍值日表.png';
      link.href = dataUrl;
      link.click();
    }catch(e){
      console.error('导出失败', e);
      alert('导出失败，可改用 Ctrl+P 打印为 PDF。');
    }finally{
      if(wasEditing){
        R.classList.add('editing');
        cells.forEach(c=>c.contentEditable='true');
      }
    }
  });
  let timer;
  document.addEventListener('input', ()=>{
    if(!editing) return;
    clearTimeout(timer);
    timer = setTimeout(save, 500);
  });
  load();
})();

/* ===================== 模块二：电工刷题 ===================== */
const D = window.QBANK;
const WB = window.WBANK;
const CATS = D.cats, QS = D.qs;
const CAT_STYLE = {
  '灯类':    { c:'var(--yellow)', shape:'tri' },
  '元器件类': { c:'var(--red)',    shape:'sq' },
  '理论类':   { c:'var(--blue)',   shape:'circle' },
  '电动机类': { c:'var(--green)',  shape:'reuleaux' },
  '材料类':   { c:'var(--orange)', shape:'trap' },
  '法律类':   { c:'var(--violet)', shape:'ellipse' },
};
const catStyle = n => CAT_STYLE[n] || { c:'var(--ink)', shape:'sq' };
const state = { cat:-1, kw:null, type:'all', search:'', wrong:false };
const esc = s => s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function renderSide(){
  const el = document.getElementById('side');
  if(state.wrong){
    el.innerHTML = `<button class="cat all on"><span class="ic" style="background:var(--red)"></span>
        <span class="nm">错题本</span><span class="ct">${WB.meta.total}</span></button>
      <div class="note">这些是你答错的题（判断 ${WB.meta.js} · 单选 ${WB.meta.dx}）。点「错题本」按钮返回全部题库。</div>`;
    return;
  }
  let h = `<button class="cat all ${state.cat===-1?'on':''}" data-c="-1">
      <span class="ic" style="background:var(--ink)"></span>
      <span class="nm">全部题目</span><span class="ct">${D.meta.extracted}</span></button>`;
  for(const c of CATS){
    const s = catStyle(c.name);
    h += `<button class="cat ${state.cat===c.id?'on':''}" data-c="${c.id}">
      <span class="ic ${s.shape}" style="background:${s.c}"></span>
      <span class="nm">${c.name}</span><span class="ct">${c.total}</span></button>`;
  }
  el.innerHTML = h;
  el.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{
    state.cat = +b.dataset.c; state.kw = null; render();
  });
}

function renderHead(){
  const el = document.getElementById('chead');
  if(state.wrong){
    el.style.setProperty('--catbar', 'var(--red)');
    el.innerHTML = `<h2>错题本<span class="st">共 ${WB.meta.total} 题 · 判断 ${WB.meta.js} · 单选 ${WB.meta.dx}</span></h2>`;
    return;
  }
  el.style.setProperty('--catbar', state.cat===-1 ? 'var(--ink)' : catStyle(CATS[state.cat].name).c);
  if(state.cat === -1){
    el.innerHTML = `<h2>全部题目<span class="st">共 ${D.meta.extracted} 题 · 来自 6 类关键词</span></h2>
      <div class="kwline">${CATS.map(c=>`<button class="kw" data-c="${c.id}"><span style="font-weight:800">${c.name}</span><span class="n">${c.total}</span></button>`).join('')}</div>`;
    el.querySelectorAll('.kw').forEach(b=>b.onclick=()=>{state.cat=+b.dataset.c;state.kw=null;render();});
    return;
  }
  const c = CATS[state.cat];
  el.innerHTML = `<h2>${c.name}<span class="st">命中 ${c.total} 题 · 判断 ${c.js} · 单选 ${c.dx}</span></h2>
    <div class="kwline">${Object.entries(c.hits).map(([k,n])=>
      `<button class="kw" data-k="${esc(k)}" ${state.kw===k?'style="background:var(--ink);color:#fff;border-color:var(--ink)"':''}>${esc(k)}<span class="n">${n}</span></button>`).join('')}
    </div>`;
  el.querySelectorAll('.kw').forEach(b=>b.onclick=()=>{
    state.kw = (state.kw===b.dataset.k) ? null : b.dataset.k; render();
  });
}

function hilite(text){
  let kws;
  if(state.cat>=0) kws = CATS[state.cat].kws;
  else kws = CATS.flatMap(c=>c.kws);
  kws = [...new Set(kws)].filter(k=>text.includes(k)).sort((a,b)=>b.length-a.length);
  if(state.kw) kws = [state.kw, ...kws.filter(k=>k!==state.kw)];
  const escaped = esc(text);
  if(!kws.length) return escaped;
  const accent = '#ffffff';
  const tint   = '#141414';
  const pat = new RegExp(kws.map(k=>esc(k).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
  const ms = [...escaped.matchAll(pat)].map(m=>({ s:m.index, e:m.index+m[0].length, t:m[0] }));
  if(!ms.length) return escaped;
  const groups = [];
  for(const x of ms){
    const last = groups[groups.length-1];
    if(last && x.s === last.e){ last.e = x.e; last.t += x.t; }
    else groups.push({ s:x.s, e:x.e, t:x.t });
  }
  let out = '', prev = 0;
  for(const g of groups){
    out += escaped.slice(prev, g.s) + `<mark style="background:${tint};color:${accent}">${g.t}</mark>`;
    prev = g.e;
  }
  return out + escaped.slice(prev);
}

function card(q){
  const kindIco = q.k===0 ? 'circle' : 'tri';
  const bar = state.cat>=0 ? catStyle(CATS[state.cat].name).c : (q.c&&q.c.length ? catStyle(CATS[q.c[0]].name).c : 'var(--ink)');
  let h = `<div class="q" style="--catbar:${bar}">
    <span class="tag"><span class="kind-ic ${kindIco}"></span>第${q.n}题</span><span class="t">${hilite(q.t)}</span>`;
  if(q.o.length){
    h += `<div class="opts">` + q.o.map(([l,t,hit])=>
      `<div class="opt ${hit?'hit':''}">${l}. ${hilite(t)}</div>`).join('') + `</div>`;
  }
  h += `<div class="foot"><div class="ans">官方答案：<b>${esc(q.a)}</b></div>`;
  if(q.s) h += `<div class="sum">${esc(q.s)}</div>`;
  h += `</div>`;
  if(state.cat===-1 && q.c && q.c.length>1){
    h += `<div class="cats">` + q.c.map(id=>{const s = catStyle(CATS[id].name);return `<span class="cmini ${s.shape}" style="background:${s.c}" title="${CATS[id].name}"></span>`;}).join('') + `</div>`;
  }
  return h + `</div>`;
}

function current(){
  let list = state.wrong ? WB.qs : QS;
  if(!state.wrong && state.cat>=0) list = list.filter(q=>q.c.includes(state.cat));
  if(!state.wrong && state.kw) list = list.filter(q=>(q.t + q.o.map(o=>o[1]).join('')).includes(state.kw));
  if(state.type!=='all') list = list.filter(q=>q.k===+state.type);
  if(state.search){
    const s = state.search.trim();
    list = list.filter(q=>(q.t + q.o.map(o=>o[1]).join('') + q.s).includes(s));
  }
  return list;
}

function render(){
  renderSide(); renderHead();
  const list = current();
  document.getElementById('count').textContent =
    `当前显示 ${list.length} 题` + (state.kw ? ` · 关键词「${state.kw}」` : '') + (state.search ? ` · 搜索「${state.search}」` : '');
  document.getElementById('list').innerHTML =
    list.length ? list.map(card).join('') : `<div class="empty">没有匹配的题目，试试更换关键词或清空搜索</div>`;
}

document.getElementById('q').addEventListener('input', e=>{ state.search = e.target.value; render(); });
document.querySelectorAll('.tpill').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tpill').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); state.type = b.dataset.t; render();
});

document.getElementById('foot').innerHTML =
  `${esc(D.meta.title)} ｜ ${esc(D.meta.src)} ｜ 仅供学习交流`;

render();
