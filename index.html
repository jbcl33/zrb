<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>低压电工题库 · 关键词专项提取</title>
<style>
:root{
  --ink:#33383F; --sub:#7A8189; --faint:#A8ADB3; --line:#E6E8EA;
  --bg:#FBFBFA; --card:#F7F7F4; --good:#6E8F72;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:#D8DCE1}

/* ---------- 顶栏 ---------- */
header{position:sticky;top:0;z-index:50;background:rgba(251,251,250,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.25;min-width:210px}
.brand b{font-size:16px;font-weight:700;letter-spacing:.5px}
.brand span{font-size:11px;color:var(--faint)}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:9px 14px 9px 36px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px;color:var(--ink);outline:none;transition:border-color .2s, box-shadow .2s}
.search input:focus{border-color:#B9BEC4;box-shadow:0 0 0 3px rgba(0,0,0,.04)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--faint);fill:none;stroke-width:2}
.tpills{display:flex;gap:6px}
.tpill{padding:7px 14px;border-radius:999px;font-size:13px;color:var(--sub);border:1px solid var(--line);background:#fff;transition:all .18s}
.tpill:hover{border-color:#C9CDD2}
.tpill.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- 主体布局 ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:26px 24px 80px;display:grid;grid-template-columns:232px 1fr;gap:28px;align-items:start}

/* 侧栏 */
.side{position:sticky;top:86px;display:flex;flex-direction:column;gap:8px}
.cat{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:11px;text-align:left;transition:background .15s;border:1px solid transparent}
.cat:hover{background:#F1F2F0}
.cat.on{background:#fff;border-color:var(--line);box-shadow:0 1px 4px rgba(0,0,0,.05)}
.cat .dot{width:9px;height:9px;border-radius:3px;flex:none}
.cat .nm{font-size:14px;font-weight:600}
.cat .ct{margin-left:auto;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.side .note{font-size:11px;color:var(--faint);padding:6px 4px 0;line-height:1.5}

/* 章节头 */
.chead{border-radius:14px;padding:18px 22px 16px;margin-bottom:16px;border:1px solid var(--line);background:#fff}
.chead h2{font-size:19px;display:flex;align-items:baseline;gap:12px}
.chead h2 .st{font-size:12.5px;color:var(--sub);font-weight:400}
.chead .kwline{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.kw{padding:4px 11px;border-radius:999px;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--sub);transition:all .15s}
.kw:hover{transform:translateY(-1px)}
.kw .n{opacity:.65;font-size:11px;margin-left:3px}

/* 卡片 */
.q{background:var(--card);border-left:3px solid var(--faint);border-radius:10px;padding:14px 18px 13px;margin-bottom:12px}
.q .tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:6px;margin-right:9px;vertical-align:1px}
.q .t{display:inline;font-weight:700;font-size:14.5px}
.q mark{border-radius:3px;padding:0 2px;font-weight:700}
.q .opts{margin-top:9px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.q .opt{padding:3px 10px;border-radius:7px;color:var(--ink)}
.q .opt.hit{color:var(--good);font-weight:700;background:rgba(110,143,114,.09)}
.q .opt.hit::before{content:"√ ";font-weight:700}
.q .foot{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:3px}
.q .ans{font-size:13px;color:var(--good);font-weight:700}
.q .ans b{font-weight:700}
.q .sum{font-size:12.5px;color:var(--sub)}
.q .sum::before{content:"考点速记｜";color:var(--faint)}
.q .cats{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap}
.q .cmini{font-size:10.5px;padding:1px 8px;border-radius:999px;color:#fff;opacity:.85}

.empty{text-align:center;color:var(--faint);padding:70px 0;font-size:14px}
.count{font-size:12.5px;color:var(--faint);margin:2px 2px 12px}
footer{text-align:center;color:var(--faint);font-size:11.5px;padding:26px 0 34px;border-top:1px solid var(--line);max-width:1180px;margin:0 auto}

@media (max-width:860px){
  .wrap{grid-template-columns:1fr;gap:16px;padding:18px 14px 60px}
  .side{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .side .note{display:none}
  .cat{flex:none;padding:8px 12px}
  .hwrap{padding:12px 14px}
}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div class="brand">
      <b>低压电工理论题库</b>
      <span>关键词专项提取 · 考前冲刺</span>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="text" placeholder="搜索题目 / 选项 / 考点…（如：熔断器、功率因数、工伤）">
    </div>
    <div class="tpills" id="tpills">
      <button class="tpill on" data-t="all">全部</button>
      <button class="tpill" data-t="0">判断题</button>
      <button class="tpill" data-t="1">单选题</button>
    </div>
  </div>
</header>

<div class="wrap">
  <nav class="side" id="side"></nav>
  <main>
    <div class="chead" id="chead"></div>
    <div class="count" id="count"></div>
    <div id="list"></div>
  </main>
</div>

<footer id="foot"></footer>

<script src="data.js"></script>
<script>
const D = window.QBANK;
const CATS = D.cats, QS = D.qs;
const state = { cat: -1, kw: null, type: 'all', search: '' };

const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 侧栏 ---------- */
function renderSide(){
  const el = document.getElementById('side');
  let h = `<button class="cat ${state.cat===-1?'on':''}" data-c="-1">
      <span class="dot" style="background:var(--ink)"></span>
      <span class="nm">全部提取题目</span><span class="ct">${D.meta.extracted}</span></button>`;
  for(const c of CATS){
    h += `<button class="cat ${state.cat===c.id?'on':''}" data-c="${c.id}">
      <span class="dot" style="background:${c.accent}"></span>
      <span class="nm">${c.name}</span><span class="ct">${c.total}</span></button>`;
  }
  h += `<div class="note">自官方 ${D.meta.totalBank} 道解析题目（判断 ${D.meta.js} · 单选 ${D.meta.dx}）中按 6 组高频关键词提取，共 ${D.meta.extracted} 道（含跨类重叠）。</div>`;
  el.innerHTML = h;
  el.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{
    state.cat = +b.dataset.c; state.kw = null; render();
    document.getElementById('list').scrollIntoView({block:'start'});
  });
}

/* ---------- 章节头 ---------- */
function renderHead(){
  const el = document.getElementById('chead');
  if(state.cat === -1){
    el.innerHTML = `<h2>全部提取题目<span class="st">共 ${D.meta.extracted} 题 · 来自 6 类关键词</span></h2>
      <div class="kwline">${CATS.map(c=>`<button class="kw" data-c="${c.id}" style="border-color:${c.accent}55"><span style="color:${c.accent};font-weight:700">${c.name}</span><span class="n">${c.total}</span></button>`).join('')}</div>`;
    el.querySelectorAll('.kw').forEach(b=>b.onclick=()=>{state.cat=+b.dataset.c;state.kw=null;render();});
    return;
  }
  const c = CATS[state.cat];
  el.style.borderTop = `3px solid ${c.accent}`;
  el.innerHTML = `<h2><span style="color:${c.accent}">${c.name}</span><span class="st">命中 ${c.total} 题 · 判断 ${c.js} · 单选 ${c.dx}</span></h2>
    <div class="kwline">${Object.entries(c.hits).map(([k,n])=>
      `<button class="kw ${state.kw===k?'':''}" data-k="${esc(k)}" style="${state.kw===k?`background:${c.accent};color:#fff;border-color:${c.accent}`:''}">${esc(k)}<span class="n">${n}</span></button>`).join('')}
    </div>`;
  el.querySelectorAll('.kw').forEach(b=>b.onclick=()=>{
    state.kw = (state.kw===b.dataset.k) ? null : b.dataset.k; render();
  });
  if(state.cat===-1) el.style.borderTop='';
}

/* ---------- 高亮 ---------- */
function hilite(text, cat){
  let kws;
  if(state.cat>=0) kws = CATS[state.cat].kws;
  else kws = CATS.flatMap(c=>c.kws);
  kws = [...new Set(kws)].filter(k=>text.includes(k)).sort((a,b)=>b.length-a.length);
  if(state.kw) kws = [state.kw, ...kws.filter(k=>k!==state.kw)];
  const escaped = esc(text);
  if(!kws.length) return escaped;
  const accent = state.cat>=0 ? CATS[state.cat].accent : '#8A8378';
  const tint   = state.cat>=0 ? CATS[state.cat].tint   : '#EFEDE8';
  // 单次交替匹配（长词优先），替换不回溯，天然避免嵌套
  const pat = new RegExp(kws.map(k=>esc(k).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
  return escaped.replace(pat, m=>`<mark style="background:${tint};color:${accent}">${m}</mark>`);
}

/* ---------- 卡片 ---------- */
function card(q){
  const cat = state.cat>=0 ? CATS[state.cat] : CATS[q.c[0]];
  const kindTxt = q.k===0 ? '判断题' : '单选题';
  let h = `<div class="q" style="border-left-color:${cat.accent}">
    <span class="tag" style="background:${cat.tint};color:${cat.accent}">[${kindTxt} · 第${q.n}题]</span><span class="t">${hilite(q.t, cat)}</span>`;
  if(q.o.length){
    h += `<div class="opts">` + q.o.map(([l,t,hit])=>
      `<div class="opt ${hit?'hit':''}">${l}. ${hilite(t, cat)}</div>`).join('') + `</div>`;
  }
  h += `<div class="foot"><div class="ans">官方答案：<b>${esc(q.a)}</b></div>`;
  if(q.s) h += `<div class="sum">${esc(q.s)}</div>`;
  h += `</div>`;
  if(state.cat===-1 && q.c.length>1){
    h += `<div class="cats">` + q.c.map(id=>`<span class="cmini" style="background:${CATS[id].accent}">${CATS[id].name}</span>`).join('') + `</div>`;
  }
  return h + `</div>`;
}

/* ---------- 过滤 ---------- */
function current(){
  let list = QS;
  if(state.cat>=0) list = list.filter(q=>q.c.includes(state.cat));
  if(state.kw) list = list.filter(q=>(q.t + q.o.map(o=>o[1]).join('')).includes(state.kw));
  if(state.type!=='all') list = list.filter(q=>q.k===+state.type);
  if(state.search){
    const s = state.search.trim();
    list = list.filter(q=>(q.t + q.o.map(o=>o[1]).join('') + q.s).includes(s));
  }
  return list;
}

function render(){
  renderSide(); renderHead();
  const list = current();
  document.getElementById('count').textContent =
    `当前显示 ${list.length} 题` + (state.kw ? ` · 关键词「${state.kw}」` : '') + (state.search ? ` · 搜索「${state.search}」` : '');
  document.getElementById('list').innerHTML =
    list.length ? list.map(card).join('') : `<div class="empty">没有匹配的题目，试试更换关键词或清空搜索</div>`;
  location.hash = `c=${state.cat}`;
}

/* ---------- 事件 ---------- */
document.getElementById('q').addEventListener('input', e=>{ state.search = e.target.value; render(); });
document.querySelectorAll('.tpill').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tpill').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); state.type = b.dataset.t; render();
});

document.getElementById('foot').innerHTML =
  `${esc(D.meta.title)} ｜ ${esc(D.meta.src)} ｜ 仅供学习交流`;

const hm = location.hash.match(/c=(-?\d+)/);
if(hm) state.cat = Math.min(Math.max(+hm[1], -1), CATS.length-1);
render();
</script>
</body>
</html>
